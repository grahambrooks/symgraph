# Git hooks via prek (https://prek.j178.dev). Install once: make hooks
# Fast checks on every commit; the full gate (`make check`, the same as CI) before push.
#:schema https://www.schemastore.org/prek.json

default_install_hook_types = ["pre-commit", "pre-push"]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  # catalog-info.yaml holds several Backstage entities, one YAML document each.
  { id = "check-yaml", args = ["--allow-multiple-documents"] },
  { id = "check-toml" },
  { id = "check-added-large-files" },
]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"
hooks = [{ id = "actionlint-system" }]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
  {
    id = "gitleaks",
    name = "Detect hardcoded secrets",
    entry = "gitleaks git --pre-commit --redact --staged --verbose",
    language = "golang",
    pass_filenames = false,
  },
]

[[repos]]
repo = "local"
hooks = [
  { id = "cargo-fmt", name = "cargo fmt --check", entry = "cargo fmt --all --check", language = "system", pass_filenames = false, types = ["rust"] },
  { id = "make-check", name = "make check", entry = "make check", language = "system", pass_filenames = false, stages = ["pre-push"] },
]
