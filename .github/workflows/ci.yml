name: Symgraph build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly, so new RustSec advisories surface without a push

permissions:
  contents: read

# Supersede in-flight runs for a branch, but never cancel a run on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Harden against transient crates.io download failures on GitHub runners.
  # `SSL_ERROR_SYSCALL` / errno 0 is curl's HTTP/2 multiplexing dropping the
  # connection mid-download; disabling multiplexing + retrying fixes it.
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain (and rustfmt/clippy) pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-features --locked

  cli-only:
    name: CLI-only build
    # Exercises the lean feature combo (no rmcp/axum/tokio): the same
    # `symgraph` binary minus `serve`. `--all-features` builds above never hit
    # this path, so a missing `#[cfg(feature = "server")]` gate would slip
    # through — which is exactly what keeps one binary serving both builds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (CLI-only)
        run: cargo clippy --bin symgraph --no-default-features --features sqlite --locked -- -D warnings
      - name: Test (CLI-only)
        run: cargo test --no-default-features --features sqlite --locked

  msrv:
    name: MSRV (${{ needs.msrv-version.outputs.version }})
    needs: msrv-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install ${{ needs.msrv-version.outputs.version }} --profile minimal
      - uses: Swatinem/rust-cache@v2
      # Builds against exactly the toolchain Cargo.toml claims, so the declared
      # MSRV is verified rather than asserted. `cargo +<floor>` explicitly, not
      # bare `cargo`: rust-toolchain.toml would otherwise override whatever was
      # installed and the job would test nothing.
      - run: cargo +${{ needs.msrv-version.outputs.version }} check --all-features --all-targets --locked

  msrv-version:
    name: Read MSRV
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        # Single source of truth: the number lives in Cargo.toml, and
        # rust-toolchain.toml must pin exactly the same toolchain.
        run: |
          set -euo pipefail
          version=$(grep -m1 -E '^rust-version *=' Cargo.toml | cut -d'"' -f2)
          pinned=$(grep -m1 -E '^channel *=' rust-toolchain.toml | cut -d'"' -f2)
          if [ -z "$version" ]; then
            echo "::error::rust-version missing from Cargo.toml"
            exit 1
          fi
          echo "rust-version=$version  channel=$pinned"
          if [ "$version" != "$pinned" ]; then
            echo "::error::rust-version ($version) and rust-toolchain.toml channel ($pinned) have drifted"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  deny:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # Advisories (RustSec, so no separate cargo-audit job), licenses, sources
      # and bans — see deny.toml.
      - run: cargo deny check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --locked

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      # Toolchain pinned in rust-toolchain.toml, plus this matrix target.
      - run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
