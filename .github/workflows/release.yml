name: Symgraph Release

on:
  push:
    tags:
      - 'v*'

# No blanket grant: each job asks for exactly what it needs. Only the two
# jobs that publish get write access.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Harden against transient crates.io download failures on GitHub runners.
  # `SSL_ERROR_SYSCALL` / errno 0 is curl's HTTP/2 multiplexing dropping the
  # connection mid-download; disabling multiplexing + retrying fixes it.
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  preflight:
    name: Verify tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify Cargo.toml version matches the tag
        # Runs before anything is built. This check used to live in the
        # crates.io job, which runs *after* the GitHub release is published —
        # so a mismatched tag produced a release that then failed to publish,
        # leaving the two out of step.
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          CARGO_VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          echo "Tag and Cargo.toml agree on $TAG_VERSION."

  build:
    name: Build ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: symgraph-linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: symgraph-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: symgraph-darwin-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: symgraph-darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: symgraph-windows-x64
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build symgraph (CLI + MCP server)
        run: cargo build --release --target ${{ matrix.target }} --bin symgraph
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Build symgraph-cli (lean, no server stack)
        # Built with the server feature off so the standalone CLI ships without
        # the rmcp/axum/tokio stack it never uses.
        run: cargo build --release --target ${{ matrix.target }} --bin symgraph-cli --no-default-features --features sqlite
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/symgraph dist/
          cp target/${{ matrix.target }}/release/symgraph-cli dist/
          chmod +x dist/symgraph dist/symgraph-cli

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        # Pin the shell that Actions already defaults to on Windows (pwsh). This
        # keeps the proven runtime behavior while telling actionlint not to run
        # shellcheck (which mis-lints these `copy`/backslash paths as bash).
        shell: pwsh
        run: |
          mkdir dist
          copy target\${{ matrix.target }}\release\symgraph.exe dist\
          copy target\${{ matrix.target }}\release\symgraph-cli.exe dist\

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  universal:
    name: Universal macOS binary
    needs: build
    # lipo ships with the Xcode command line tools, so this has to run on
    # macOS. The previous arrangement ran on the Linux packaging job, could
    # not call lipo, and shipped the arm64 slice under a "universal" name —
    # which an Intel Mac cannot execute.
    runs-on: macos-latest
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: symgraph-darwin-*
          path: artifacts

      - name: Fuse x64 + arm64 slices
        run: |
          mkdir -p dist
          for bin in symgraph symgraph-cli; do
            lipo -create \
              -output "dist/${bin}" \
              "artifacts/symgraph-darwin-x64/${bin}" \
              "artifacts/symgraph-darwin-arm64/${bin}"
            chmod +x "dist/${bin}"
            lipo -info "dist/${bin}"
          done

      - name: Verify both architectures are present
        run: |
          for bin in symgraph symgraph-cli; do
            info="$(lipo -info "dist/${bin}")"
            echo "${info}" | grep -q x86_64 || { echo "::error::${bin} is missing the x86_64 slice"; exit 1; }
            echo "${info}" | grep -q arm64  || { echo "::error::${bin} is missing the arm64 slice";  exit 1; }
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: symgraph-darwin-universal
          path: dist/

  package:
    name: Package MCPB
    needs: [build, universal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install mcpb CLI
        run: npm install -g @anthropic-ai/mcpb

      - name: Prepare bundle structure
        run: |
          mkdir -p bundle/bin

          # Copy manifest
          cp manifest.json bundle/

          # Update manifest version from tag
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v' bundle/manifest.json > bundle/manifest.tmp.json
          mv bundle/manifest.tmp.json bundle/manifest.json

      - name: Create platform-specific bundles
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}

          # macOS x64
          mkdir -p bundle-darwin-x64/bin
          cp bundle/manifest.json bundle-darwin-x64/
          cp artifacts/symgraph-darwin-x64/symgraph bundle-darwin-x64/bin/
          chmod +x bundle-darwin-x64/bin/symgraph
          cd bundle-darwin-x64 && zip -r "../symgraph-${VERSION}-darwin-x64.mcpb" . && cd ..

          # macOS arm64
          mkdir -p bundle-darwin-arm64/bin
          cp bundle/manifest.json bundle-darwin-arm64/
          cp artifacts/symgraph-darwin-arm64/symgraph bundle-darwin-arm64/bin/
          chmod +x bundle-darwin-arm64/bin/symgraph
          cd bundle-darwin-arm64 && zip -r "../symgraph-${VERSION}-darwin-arm64.mcpb" . && cd ..

          # Linux x64
          mkdir -p bundle-linux-x64/bin
          cp bundle/manifest.json bundle-linux-x64/
          cp artifacts/symgraph-linux-x64/symgraph bundle-linux-x64/bin/
          chmod +x bundle-linux-x64/bin/symgraph
          cd bundle-linux-x64 && zip -r "../symgraph-${VERSION}-linux-x64.mcpb" . && cd ..

          # Linux arm64
          mkdir -p bundle-linux-arm64/bin
          cp bundle/manifest.json bundle-linux-arm64/
          cp artifacts/symgraph-linux-arm64/symgraph bundle-linux-arm64/bin/
          chmod +x bundle-linux-arm64/bin/symgraph
          cd bundle-linux-arm64 && zip -r "../symgraph-${VERSION}-linux-arm64.mcpb" . && cd ..

          # Windows x64
          mkdir -p bundle-windows-x64/bin
          cp bundle/manifest.json bundle-windows-x64/
          cp artifacts/symgraph-windows-x64/symgraph.exe bundle-windows-x64/bin/
          cd bundle-windows-x64 && zip -r "../symgraph-${VERSION}-windows-x64.mcpb" . && cd ..

      - name: Create universal macOS bundle
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}

          # The fat binary is built by the `universal` job on a macOS runner;
          # here it is only repackaged.
          mkdir -p bundle-darwin-universal/bin
          cp bundle/manifest.json bundle-darwin-universal/
          cp artifacts/symgraph-darwin-universal/symgraph bundle-darwin-universal/bin/
          chmod +x bundle-darwin-universal/bin/symgraph
          cd bundle-darwin-universal && zip -r "../symgraph-${VERSION}-darwin-universal.mcpb" . && cd ..

      - name: Upload MCPB bundles
        uses: actions/upload-artifact@v7
        with:
          name: mcpb-bundles
          path: "*.mcpb"

  release:
    name: Create Release
    needs: [build, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare versioned manifest
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v' manifest.json > manifest-versioned.json

      - name: Prepare release assets
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          mkdir -p release

          # Create tarballs for standalone binaries. Each bundles both the
          # full `symgraph` (CLI + MCP server) and the lean `symgraph-cli`,
          # alongside manifest.json.
          cp manifest-versioned.json artifacts/symgraph-linux-x64/manifest.json
          cd artifacts/symgraph-linux-x64
          tar -czf "../../release/symgraph-${VERSION}-linux-x64.tar.gz" symgraph symgraph-cli manifest.json
          cd ../..

          cp manifest-versioned.json artifacts/symgraph-linux-arm64/manifest.json
          cd artifacts/symgraph-linux-arm64
          tar -czf "../../release/symgraph-${VERSION}-linux-arm64.tar.gz" symgraph symgraph-cli manifest.json
          cd ../..

          cp manifest-versioned.json artifacts/symgraph-darwin-x64/manifest.json
          cd artifacts/symgraph-darwin-x64
          tar -czf "../../release/symgraph-${VERSION}-darwin-x64.tar.gz" symgraph symgraph-cli manifest.json
          cd ../..

          cp manifest-versioned.json artifacts/symgraph-darwin-arm64/manifest.json
          cd artifacts/symgraph-darwin-arm64
          tar -czf "../../release/symgraph-${VERSION}-darwin-arm64.tar.gz" symgraph symgraph-cli manifest.json
          cd ../..

          cp manifest-versioned.json artifacts/symgraph-windows-x64/manifest.json
          cd artifacts/symgraph-windows-x64
          zip "../../release/symgraph-${VERSION}-windows-x64.zip" symgraph.exe symgraph-cli.exe manifest.json
          cd ../..

          # Copy MCPB bundles
          cp artifacts/mcpb-bundles/*.mcpb release/

      - name: Generate checksums
        # One manifest covering every published asset, so an installer can
        # verify what it downloaded instead of trusting the transport.
        # Written outside the directory first so the manifest can never list
        # itself, whatever the shell's expansion order.
        working-directory: release
        run: |
          find . -maxdepth 1 -type f -printf '%P\0' \
            | sort -z \
            | xargs -0 sha256sum -- > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          echo "Published assets:"
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    name: Update Homebrew formula
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download release tarballs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          mkdir -p hb
          for arch in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            gh release download "v${VERSION}" -R "${GITHUB_REPOSITORY}" \
              -p "symgraph-${VERSION}-${arch}.tar.gz" -O "hb/${arch}.tar.gz"
          done

      - name: Rewrite Formula/symgraph.rb version + sha256s
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          python3 - "$VERSION" <<'PY'
          import hashlib, pathlib, re, sys

          version = sys.argv[1]
          archs = ["darwin-arm64", "darwin-x64", "linux-arm64", "linux-x64"]
          shas = {
              a: hashlib.sha256(pathlib.Path(f"hb/{a}.tar.gz").read_bytes()).hexdigest()
              for a in archs
          }

          formula = pathlib.Path("Formula/symgraph.rb")
          text = formula.read_text()
          text = re.sub(r'(?m)^(  version ")[^"]*(")', rf'\g<1>{version}\g<2>', text)

          # Each url line names the arch via the tarball filename; the sha256 sits
          # on the following line inside the same on_arm/on_intel block.
          lines = text.splitlines(keepends=True)
          for i, line in enumerate(lines):
              m = re.search(r'symgraph-#\{version\}-([a-z0-9-]+)\.tar\.gz', line)
              if not m or m.group(1) not in shas:
                  continue
              for j in range(i + 1, len(lines)):
                  if "sha256" in lines[j]:
                      lines[j] = re.sub(r'sha256 "[0-9a-f]*"',
                                        f'sha256 "{shas[m.group(1)]}"', lines[j])
                      break
          formula.write_text("".join(lines))
          PY

      - name: Commit and push formula
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          if git diff --quiet Formula/symgraph.rb; then
            echo "Formula already up to date for ${VERSION}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/symgraph.rb
          git commit -m "chore: update Homebrew formula to ${VERSION}"
          git push origin HEAD:main

  devcontainer-feature:
    name: Publish Devcontainer Feature
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Update feature version from tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v' \
            devcontainer-feature/src/symgraph/devcontainer-feature.json > tmp.json
          mv tmp.json devcontainer-feature/src/symgraph/devcontainer-feature.json

      - name: Publish devcontainer feature
        uses: devcontainers/action@v1
        with:
          publish-features: true
          base-path-to-features: devcontainer-feature/src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  crates-io:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The tag/Cargo.toml check lives in the `preflight` job, which gates
      # every other job in this workflow.
      - name: Publish to crates.io
        run: cargo publish --token "${CARGO_REGISTRY_TOKEN}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
