[package]
name = "symgraph"
version = "2026.9.2"
edition = "2021"
# Set by tree-sitter 0.27 / tree-sitter-language 0.1.8, the highest MSRV in the
# dependency tree. The `msrv` CI job builds against exactly this toolchain, so
# the number is checked rather than asserted.
rust-version = "1.98.1"
description = "Semantic code intelligence library and MCP server - build knowledge graphs of codebases"
license = "MIT"
authors = ["Graham Brooks"]
repository = "https://github.com/grahambrooks/symgraph"
homepage = "https://github.com/grahambrooks/symgraph"
readme = "README.md"
keywords = ["mcp", "code-analysis", "tree-sitter", "semantic-search"]
categories = ["development-tools", "command-line-utilities"]
exclude = [
    "target/*",
    ".github/*",
    "devcontainer-feature/*",
    "tests/fixtures/*",
    "*.mcpb",
    "*.png",
]

[dependencies]
# MCP protocol (server-only; gated behind the `server` feature)
rmcp = { version = "2.1.0", features = ["server", "macros", "transport-io", "transport-streamable-http-server"], optional = true }

# HTTP server (server-only)
axum = { version = "0.8", optional = true }
tokio-util = { version = "0.7", optional = true }

# Async runtime (server-only)
tokio = { version = "1", features = ["full"], optional = true }

# JSON Schema derive for MCP request types. Depended on directly (rather than
# via rmcp's re-export) so the request structs compile in CLI-only builds that
# exclude the server stack.
schemars = "1.2"

# Tree-sitter for code parsing
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-scala = "0.26"
tree-sitter-groovy = "0.1.2"
tree-sitter-ruby = "0.23"

# Database
rusqlite = { version = "0.40.0", features = ["bundled"], optional = true }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# Error handling
anyhow = "1"

# Parallelism
rayon = "1.10"

# Utilities
ignore = "0.4"
sha2 = "0.11"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.18"

[features]
default = ["sqlite", "server"]
sqlite = ["rusqlite"]
# The MCP server (stdio + HTTP transports). Pulls in the async/HTTP stack.
# Disable it (`--no-default-features --features sqlite`) for a lean CLI-only
# `symgraph` without rmcp/axum/tokio — every command except `serve`.
server = ["sqlite", "dep:rmcp", "dep:axum", "dep:tokio", "dep:tokio-util"]

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports"] }

# Performance guard for the operations that scale with codebase size:
# full index build, no-op incremental pass, and graph folding.
[[bench]]
name = "indexing"
harness = false
required-features = ["sqlite"]

# One binary: every CLI command, plus `serve` for the MCP server when the
# `server` feature is on. A CLI-only build is the same binary minus that one
# command (`--no-default-features --features sqlite`); it does not need a
# separate target, and having one produced two dispatch tables that drifted.
[[bin]]
name = "symgraph"
path = "src/main.rs"
required-features = ["sqlite"]
